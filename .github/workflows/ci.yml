name: AXIOM WASM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-wasm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Format, lint, and compile WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy for WASM target
        run: cargo clippy --workspace --target wasm32-unknown-unknown --release -- -D warnings

      - name: Compile workspace for WASM
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Upload WASM build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axiom-wasm-release
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 14
